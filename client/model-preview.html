<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Garage Jam Model Preview</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #121419; }
      canvas { display: block; }
      #note { position: fixed; top: 12px; left: 12px; color: #e8ff2a; font: 700 16px ui-sans-serif, system-ui, sans-serif; background: #0d0d10; padding: 8px 12px; border: 2px solid #ff2d95; }
    </style>
  </head>
  <body>
    <div id="note">MODEL PREVIEW — camera from +Z. Blue axis points at camera.</div>
    <script type="module">
      import * as THREE from 'three';
      import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
      import { MeshoptDecoder } from 'meshoptimizer';
      import { comicMaterial } from '/src/comic-style.ts';

      const models = [
        ['trash-can', 'trash-can.glb'],
        ['paint-cans', 'paint-cans.glb'],
        ['tool-set', 'tool-set.glb'],
        ['storage-shelf', 'storage-shelf.glb'],
        ['industrial-light', 'industrial-light.glb'],
        ['neon-sign', 'neon-sign.glb'],
        ['metal-shutter', 'metal-shutter.glb'],
        ['wooden-workbench', 'wooden-workbench.glb'],
        ['crumpled-paper', 'crumpled-paper.glb'],
      ];
      const rotate = Number(new URLSearchParams(location.search).get('rotate') || 0) * Math.PI / 180;

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      document.body.append(renderer.domElement);

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x121419);
      scene.add(new THREE.HemisphereLight(0xffe3c0, 0x241b2e, 2.2));
      const sun = new THREE.DirectionalLight(0xffc98a, 2.4);
      sun.position.set(4, 6, 5);
      scene.add(sun);

      const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
      camera.position.set(0, 2.25, 10);
      camera.lookAt(0, 2.25, 0);

      const loader = new GLTFLoader();
      loader.setMeshoptDecoder(MeshoptDecoder);

      const findTopSurface = (model) => {
        model.updateMatrixWorld(true);
        const buckets = new Map();
        const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3();
        const ab = new THREE.Vector3(), ac = new THREE.Vector3(), normal = new THREE.Vector3();
        model.traverse(object => {
          if (!object.isMesh) return;
          const geometry = object.geometry;
          const position = geometry.attributes.position;
          if (!position) return;
          const index = geometry.index;
          const count = index ? index.count : position.count;
          for (let i = 0; i < count; i += 3) {
            const ia = index ? index.getX(i) : i;
            const ib = index ? index.getX(i + 1) : i + 1;
            const ic = index ? index.getX(i + 2) : i + 2;
            a.fromBufferAttribute(position, ia).applyMatrix4(object.matrixWorld);
            b.fromBufferAttribute(position, ib).applyMatrix4(object.matrixWorld);
            c.fromBufferAttribute(position, ic).applyMatrix4(object.matrixWorld);
            ab.subVectors(b, a); ac.subVectors(c, a); normal.crossVectors(ab, ac);
            if (normal.lengthSq() < 1e-12 || normal.y / Math.sqrt(normal.lengthSq()) < 0.5) continue;
            const area = normal.length() / 2;
            const y = Math.round(((a.y + b.y + c.y) / 3) * 200) / 200;
            buckets.set(y, (buckets.get(y) || 0) + area);
          }
        });
        let best = null;
        for (const [y, area] of buckets) if (!best || area > best.area) best = { y, area };
        if (best) {
          const tb = { minX: Infinity, maxX: -Infinity, minZ: Infinity, maxZ: -Infinity };
          model.traverse(object => {
            if (!object.isMesh) return;
            const geometry = object.geometry;
            const position = geometry.attributes.position;
            if (!position) return;
            const index = geometry.index;
            const count = index ? index.count : position.count;
            for (let i = 0; i < count; i += 3) {
              const ia = index ? index.getX(i) : i;
              const ib = index ? index.getX(i + 1) : i + 1;
              const ic = index ? index.getX(i + 2) : i + 2;
              a.fromBufferAttribute(position, ia).applyMatrix4(object.matrixWorld);
              b.fromBufferAttribute(position, ib).applyMatrix4(object.matrixWorld);
              c.fromBufferAttribute(position, ic).applyMatrix4(object.matrixWorld);
              ab.subVectors(b, a); ac.subVectors(c, a); normal.crossVectors(ab, ac);
              const length = normal.length();
              if (length < 1e-6 || normal.y / length < 0.5) continue;
              const y = Math.round(((a.y + b.y + c.y) / 3) * 200) / 200;
              if (y !== best.y) continue;
              for (const point of [a, b, c]) {
                tb.minX = Math.min(tb.minX, point.x); tb.maxX = Math.max(tb.maxX, point.x);
                tb.minZ = Math.min(tb.minZ, point.z); tb.maxZ = Math.max(tb.maxZ, point.z);
              }
            }
          });
          best.bounds = tb;
          best.center = { x: (tb.minX + tb.maxX) / 2, z: (tb.minZ + tb.maxZ) / 2 };
          best.size = { x: tb.maxX - tb.minX, z: tb.maxZ - tb.minZ };
        }
        return best;
      };

      const labelTexture = (text) => {
        const canvas = document.createElement('canvas'); canvas.width = 512; canvas.height = 96;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#0d0d10'; ctx.fillRect(0, 0, 512, 96);
        ctx.strokeStyle = '#ff2d95'; ctx.lineWidth = 6; ctx.strokeRect(3, 3, 506, 90);
        ctx.fillStyle = '#e8ff2a'; ctx.font = 'bold 38px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(text, 256, 50);
        const texture = new THREE.CanvasTexture(canvas); texture.colorSpace = THREE.SRGBColorSpace;
        return texture;
      };

      for (const [index, [name, file]] of models.entries()) {
        const column = index % 3, row = Math.floor(index / 3);
        const cellX = (column - 1) * 3.1;
        const cellY = (2 - row) * 1.75 + 0.25;
        const pivot = new THREE.Group();
        pivot.position.set(cellX, cellY, 0);
        pivot.rotation.y = rotate;
        scene.add(pivot);

        const axes = new THREE.AxesHelper(0.55);
        axes.position.set(0, 0.01, 0);
        scene.add(axes.clone().translateX(cellX).translateY(cellY));

        const label = new THREE.Sprite(new THREE.SpriteMaterial({ map: labelTexture(name), depthTest: false }));
        label.scale.set(1.7, 0.32, 1);
        label.position.set(cellX, cellY + 1.45, 0);
        scene.add(label);

        try {
          const gltf = await loader.loadAsync(`/assets/models/optimized/${file}`);
          const model = gltf.scene;
          const bounds = new THREE.Box3().setFromObject(model);
          const size = bounds.getSize(new THREE.Vector3());
          window.modelBounds = window.modelBounds || {};
          window.modelBounds[name] = {
            min: bounds.min.toArray().map(value => Number(value.toFixed(3))),
            max: bounds.max.toArray().map(value => Number(value.toFixed(3))),
            size: size.toArray().map(value => Number(value.toFixed(3))),
            topSurface: findTopSurface(model),
          };
          const scale = 1.15 / Math.max(size.x, size.y, size.z, 0.001);
          model.scale.setScalar(scale);
          const scaled = new THREE.Box3().setFromObject(model);
          const center = scaled.getCenter(new THREE.Vector3());
          model.position.set(-center.x, -scaled.min.y, -center.z);
          const meshes = [];
          model.traverse(object => { if (object.isMesh) meshes.push(object); });
          meshes.forEach(mesh => {
            const source = Array.isArray(mesh.material) ? mesh.material[0] : mesh.material;
            mesh.material = comicMaterial(source?.color ?? 0xffffff, source?.map ?? null);
          });
          pivot.add(model);
        } catch (error) {
          console.error(name, error);
          const label = new THREE.Sprite(new THREE.SpriteMaterial({ map: labelTexture(`${name} FAILED`), depthTest: false }));
          label.scale.set(2.2, 0.4, 1);
          label.position.set(cellX, cellY + 0.6, 0);
          scene.add(label);
        }
      }

      renderer.render(scene, camera);
      window.modelPreviewReady = true;
      addEventListener('resize', () => {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
        renderer.render(scene, camera);
      });
    </script>
  </body>
</html>
