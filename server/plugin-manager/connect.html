<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connect a plugin - Garage Jam</title>
  <link rel="stylesheet" href="/api/plugins/assets/style.css">
  <script type="module" src="/api/plugins/assets/connect.js"></script>
</head>
<body>
  <main>
    <a class="back" href="/">Back to Garage Jam</a>
    <h1>Connect a plugin</h1>
    <p class="intro">Enter the 6-character code shown in your headset. The connection will be saved to that headset, not this phone or laptop.</p>
    <p id="notice" role="status" hidden></p>
    <form id="pair-form">
      <label for="pair-code">Pairing code</label>
      <div class="actions">
        <input id="pair-code" name="code" minlength="6" maxlength="6" autocomplete="one-time-code" required>
        <button type="submit">Continue</button>
      </div>
    </form>
    <p class="credit">The code expires after 10 minutes and can only be used once.</p>
  </main>
</body>
</html>
