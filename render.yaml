services:
  - type: web
    name: garage-jam
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: singapore
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PLUGIN_SHARED_PROFILE
        value: garage-demo-shared-profile-2026
    disk:
      name: garage-data
      mountPath: /app/server/data
      sizeGB: 1
