app = "garage-jam-demo"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PLUGIN_SHARED_PROFILE = "garage-demo-shared-profile-2026"

[http_service]
  internal_port = 8082
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "garage_data"
  destination = "/app/server/data"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
